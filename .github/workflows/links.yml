name: Links

# Catches the mechanical error this repository is most prone to: renaming a
# file and forgetting a link that pointed at it.

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relative-links:
    name: Relative links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — no dependencies to install, nothing to audit.
      - name: Check relative links
        run: python3 .github/scripts/check_links.py
