name: Freshness

# This repository's main risk is not being wrong — it is being right and then
# quietly becoming wrong. Every factual page carries a `Last verified` date;
# this job is what keeps those dates from becoming decoration.
#
# It never fails a build. A page does not stop being correct on the day it
# turns three months old — it just stops being trustworthy without a recheck.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale-pages:
    name: Pages needing a recheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Written to a file, never interpolated into a shell command.
      - name: Collect stale pages
        run: |
          python3 .github/scripts/check_freshness.py --markdown > report.md
          cat report.md

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Pages due for reverification"
        run: |
          set -euo pipefail

          if head -n 1 report.md | grep -q "^All pages verified"; then
            echo "Nothing stale."
            number=$(gh issue list --state open --search "$TITLE in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Everything is back within the freshness window. Closing."
              gh issue close "$number"
            fi
            exit 0
          fi

          number=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
            echo "Updated issue #$number"
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
